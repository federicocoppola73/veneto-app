# Nomi dei luoghi nelle 5 lingue: propone le traduzioni dai titoli di Wikipedia e scrive docs/nomi/<città>.md da rivedere.
name: Nomi luoghi (Wikipedia)

on:
  workflow_dispatch:
    inputs:
      citta:
        description: 'Città separate da spazio (es. venezia padova)'
        required: true

permissions:
  contents: write

concurrency:
  group: nomi
  cancel-in-progress: false

jobs:
  nomi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Cerca i nomi
        run: python3 strumenti/nomi_wikipedia.py ${{ inputs.citta }}
      - name: Pubblica
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A docs/nomi
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -q -m "Nomi dei luoghi nelle 5 lingue (proposta da Wikipedia): ${{ inputs.citta }}"
          for i in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            echo "Tentativo $i non riuscito, riprovo tra 20 secondi"; sleep 20
          done
          exit 1
